{% extends "base.html" %}
{% block title %}Registrar pérdida · {{ evento['nombre'] }}{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1>Registrar pérdida</h1><p class="muted">{{ evento['nombre'] }} · Se descuenta su costo del resultado.</p></div>
  <a class="button secondary small" href="{{ url_for('evento', evento_id=evento['id']) }}">Volver</a>
</div>
<div class="section narrow-section">
  <form method="POST" class="form">
    <label for="producto_id">Producto</label>
    <select name="producto_id" id="producto_id" required>
      {% for p in productos %}<option value="{{ p['id'] }}">{{ p['nombre'] }} · quedan {{ (p['stock']*p['rendimiento'])|num_fmt }} {{ p['unidad_venta'] }}</option>{% endfor %}
    </select>
    <label>Cantidad</label>
    <div class="qty-group standalone-qty">
      <button type="button" class="qty-btn" onclick="changeQty(-1)" aria-label="Menos">−</button>
      <input type="number" name="cantidad" id="cantidad" min="1" step="1" value="1" required class="qty-input">
      <button type="button" class="qty-btn" onclick="changeQty(1)" aria-label="Más">＋</button>
    </div>
    <label for="motivo">Motivo</label>
    <textarea name="motivo" id="motivo" rows="3" placeholder="Ej: vaso roto, comida quemada, vencido" required></textarea>
    <button class="button danger">Registrar pérdida</button>
  </form>
</div>
<script>function changeQty(d){const i=document.getElementById('cantidad');i.value=Math.max(1,Number(i.value||1)+d)}</script>
{% endblock %}
