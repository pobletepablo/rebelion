<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Rebelión{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><header>
<a href="{{url_for('index')}}" class="logo-container">
  <img src="{{ url_for('static', filename='logo.png') }}" alt="Rebelión Logo" class="nav-logo">
</a>
<nav>
<a href="{{url_for('index')}}">Inicio</a>
<a href="{{url_for('productos')}}">Stock</a>
<a href="{{url_for('movimientos')}}">Movimientos</a>
<a href="{{url_for('eventos')}}">Eventos</a>
</nav></header><main>
{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}
<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main></body></html>
